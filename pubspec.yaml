name: cloud_frog
description: A library to help build secure Google Cloud services using Dart Frog.
version: 1.3.2
repository: https://github.com/labrom/cloud_frog

environment:
  sdk: ^3.8.0

dependencies:
  asn1lib: ^1.6.5
  dart_frog: ^1.2.6
  dart_frog_auth: ^1.2.2
  dart_frog_request_logger: ^0.0.2
  dart_jsonwebtoken: ^3.4.1
  gcputil: ^0.1.0
  http: ^1.6.0
  json_annotation: ^4.9.0
  json_serializable: ^6.11.2
  timezone: ^0.11.0

dev_dependencies:
  build_runner: ^2.10.4
  lints: ^6.0.0
  test: ^1.28.0
  very_good_analysis: ^10.0.0
